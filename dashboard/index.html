<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Indoor Asset Tracking</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div>
      <h1>Indoor Asset Tracking</h1>
      <p>ESP32 BLE + MQTT + RSSI positioning</p>
    </div>
    <span id="status">Connecting...</span>
  </header>
  <main>
    <section class="floor">
      <h2>Floor Map</h2>
      <div id="map" class="map">
        <div class="anchor a1">A1</div>
        <div class="anchor a2">A2</div>
        <div class="anchor a3">A3</div>
        <div class="anchor a4">A4</div>
      </div>
    </section>
    <section class="panel">
      <h2>Tracked Assets</h2>
      <div id="assets"></div>
    </section>
  </main>
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
